databases:
  - name: startup-validator-db
    plan: free
    databaseName: affinity
    user: affinity

services:
  - type: web
    name: startup-validator-backend
    runtime: python
    plan: free
    branch: staging
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m spacy download en_core_web_sm
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://startup-validator-frontend-5qcr.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: startup-validator-db
          property: connectionString

  - type: web
    name: startup-validator-frontend
    runtime: static
    branch: staging
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://startup-validator-backend-pruu.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
