name: CI

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      # No GROQ_API_KEY/TAVILY_API_KEY/DATABASE_URL secrets are set here on
      # purpose:
      #   - tests/test_integration.py's real-provider test is decorated
      #     with @unittest.skipUnless(os.environ.get("GROQ_API_KEY"), ...)
      #     specifically so CI never makes a real, billed Groq call - it
      #     skips cleanly here and only runs for a developer who has set
      #     GROQ_API_KEY locally.
      #   - DATABASE_URL unset falls back to a local SQLite file
      #     (agent/db.py), so the database-backed tests need no services
      #     block or managed Postgres instance in this workflow.
      - name: Run test suite
        run: python -m unittest discover -s tests

  frontend-build:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
